name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FB_API_KEY: AIzaSyD0T-Y-5VbKonnt_MpAhGjF42o_3sjMFew
          VITE_FB_AUTH_DOMAIN: ram-green-erp.firebaseapp.com
          VITE_FB_PROJECT_ID: ram-green-erp
          VITE_FB_STORAGE_BUCKET: ram-green-erp.firebasestorage.app
          VITE_FB_MESSAGING_SENDER_ID: "977277723636"
          VITE_FB_APP_ID: 1:977277723636:web:4126bfde67cdbae126cfa1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
