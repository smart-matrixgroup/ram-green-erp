<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- Outer circle border -->
  <circle cx="110" cy="110" r="106" fill="white" stroke="#111" stroke-width="5"/>

  <!-- SUN rays (no vertical line hanging down) -->
  <g stroke="#111" stroke-width="2.8" stroke-linecap="round">
    <!-- Top -->
    <line x1="68" y1="30" x2="68" y2="38"/>
    <!-- Bottom -->
    <line x1="68" y1="68" x2="68" y2="76"/>
    <!-- Left -->
    <line x1="30" y1="53" x2="38" y2="53"/>
    <!-- Right -->
    <line x1="98" y1="53" x2="90" y2="53"/>
    <!-- Top-right diagonal -->
    <line x1="88" y1="33" x2="82" y2="39"/>
    <!-- Bottom-right diagonal -->
    <line x1="88" y1="73" x2="82" y2="67"/>
    <!-- Top-left diagonal -->
    <line x1="48" y1="33" x2="54" y2="39"/>
    <!-- Bottom-left diagonal -->
    <line x1="48" y1="73" x2="54" y2="67"/>
  </g>
  <!-- Sun circle (hollow) -->
  <circle cx="68" cy="53" r="13" fill="white" stroke="#111" stroke-width="3.5"/>

  <!-- RAM text -->
  <text x="96" y="50" font-family="Arial Black,Impact,sans-serif" font-size="23" font-weight="900" fill="#111">RAM</text>
  <!-- Green Energy text -->
  <text x="96" y="65" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#111">Green Energy</text>

  <!-- BATTERY BODY (rounded rect) -->
  <rect x="22" y="108" width="152" height="72" rx="15" ry="15" fill="#111"/>
  <!-- Battery terminal on right -->
  <rect x="174" y="124" width="16" height="34" rx="5" ry="5" fill="#111"/>
  <!-- White inner area -->
  <rect x="31" y="116" width="132" height="56" rx="9" ry="9" fill="white"/>

  <!-- SOLAR PANELS — 6 cells, 2 rows x 3 cols, slight diagonal -->
  <!-- Row 1 -->
  <polygon points="37,122  78,117  78,133  37,138" fill="#222"/>
  <polygon points="82,117  116,113  116,129  82,133" fill="#222"/>
  <polygon points="120,113  155,109  155,125  120,129" fill="#222"/>
  <!-- Row 2 -->
  <polygon points="37,140  78,135  78,151  37,156" fill="#222"/>
  <polygon points="82,135  116,131  116,147  82,151" fill="#222"/>
  <polygon points="120,131  155,127  155,143  120,147" fill="#222"/>

  <!-- POWER CORD -->
  <path d="M 72 180 Q 66 194 56 196 Q 46 198 44 190" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>

  <!-- PLUG body -->
  <rect x="36" y="185" width="16" height="9" rx="3" fill="#111"/>
  <!-- Plug pins -->
  <line x1="41" y1="194" x2="41" y2="201" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="194" x2="48" y2="201" stroke="#111" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom curved text — full arc inside circle -->
  <path id="btmArc" d="M 18 140 A 96 96 0 0 0 202 140" fill="none"/>
  <text font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#111" letter-spacing="1.5">
    <textPath href="#btmArc" startOffset="50%" text-anchor="middle">RO GREEN ENERGY PVT LTD</textPath>
  </text>
</svg>
